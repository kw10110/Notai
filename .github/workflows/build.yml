name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect whether the Gradle project is at the repo root or in a subfolder
      - name: Find project root
        id: find_root
        run: |
          if [ -f "gradlew" ]; then
            echo "project_dir=." >> $GITHUB_OUTPUT
          elif [ -f "notai_android/gradlew" ]; then
            echo "project_dir=notai_android" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ${{ steps.find_root.outputs.project_dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.find_root.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotAI-Android-APK
          path: ${{ steps.find_root.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
